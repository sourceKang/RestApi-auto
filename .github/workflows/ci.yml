name: CI

on:
  push:
    branches: ["codex/prepare-github-upload", "codex/neox-profile-read-path-fix"]
  pull_request:
    branches: ["codex/prepare-github-upload"]

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  offline-checks:
    name: Compile check, test collection and offline unit test
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Install dependencies
        run: python -m pip install -r requirements.txt

      - name: Compile check
        run: python -m compileall -q clients cases config_loader configs services tests models utils tools conftest.py

      # DUT/EMS-dependent tests need real lab hardware this runner cannot reach, so this
      # only confirms the suite imports and collects cleanly. --skip-dut-preflight stops
      # the collection-time hook from attempting a live EMS/SSH connection (see
      # tests/support/preflight.py); it does not execute any test bodies.
      - name: Collect the full test suite
        run: python -m pytest --collect-only --skip-dut-preflight -q

      - name: Check tracked configs for plaintext secrets
        run: python tools/check_config_secrets.py

      # Unit tests marked `offline` need no EMS, DUT or network (see pytest.ini).
      - name: Run offline unit tests
        run: python -m pytest -m offline -q --skip-dut-preflight

      # An offline run must not register a TestLink case; if one leaks, the report hook
      # writes a formal report under reports/<version>/ that skews regression comparisons.
      # Dot directories such as reports/.allure-results-current hold Allure scratch files.
      - name: Confirm offline tests wrote no formal report
        shell: pwsh
        run: |
          $leaked = Get-ChildItem -Path reports -Directory -ErrorAction SilentlyContinue |
            Where-Object { -not $_.Name.StartsWith('.') } |
            Get-ChildItem -Filter *.txt -File
          if ($leaked) { $leaked.FullName; throw "Offline tests wrote formal reports." }
