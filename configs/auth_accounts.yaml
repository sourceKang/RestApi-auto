version: 1

profiles:
  default:
    readwrite_account: "default"
    readonly_account: "default"
    noaccess_account: "default"

  rad_external:
    readwrite_account: "readwrite1"
    readonly_account: "readonly1"
    noaccess_account: "noaccess1"


  ems_local_rw2:
    readwrite_account: "readwrite2"
    readonly_account: "readonly2"
    noaccess_account: "noaccess2"
accounts:
  readwrite:
    default:
      source: "ems_local"
      username: "${EMS_AUTH_READWRITE_DEFAULT_USERNAME:-example_readwrite_default}"
      password: "${EMS_AUTH_READWRITE_DEFAULT_PASSWORD:-CHANGE_ME}"
    readwrite1:
      username: "${EMS_AUTH_READWRITE_READWRITE1_USERNAME:-example_readwrite_readwrite1}"
      password: "${EMS_AUTH_READWRITE_READWRITE1_PASSWORD:-CHANGE_ME}"
      source: "rad_external"

    readwrite2:
      source: "ems_local"
      username: "${EMS_AUTH_READWRITE_READWRITE2_USERNAME:-example_readwrite_readwrite2}"
      password: "${EMS_AUTH_READWRITE_READWRITE2_PASSWORD:-CHANGE_ME}"
  readonly:
    default:
      source: "ems_local"
      username: "${EMS_AUTH_READONLY_DEFAULT_USERNAME:-example_readonly_default}"
      password: "${EMS_AUTH_READONLY_DEFAULT_PASSWORD:-CHANGE_ME}"
    readonly1:
      username: "${EMS_AUTH_READONLY_READONLY1_USERNAME:-example_readonly_readonly1}"
      password: "${EMS_AUTH_READONLY_READONLY1_PASSWORD:-CHANGE_ME}"
      source: "rad_external"
    readonly2:
      source: "ems_local"
      username: "${EMS_AUTH_READONLY_READONLY2_USERNAME:-example_readonly_readonly2}"
      password: "${EMS_AUTH_READONLY_READONLY2_PASSWORD:-CHANGE_ME}"

  noaccess:
    default:
      source: "ems_local"
      username: "${EMS_AUTH_NOACCESS_DEFAULT_USERNAME:-example_noaccess_default}"
      password: "${EMS_AUTH_NOACCESS_DEFAULT_PASSWORD:-CHANGE_ME}"
    noaccess1:
      username: "${EMS_AUTH_NOACCESS_NOACCESS1_USERNAME:-example_noaccess_noaccess1}"
      password: "${EMS_AUTH_NOACCESS_NOACCESS1_PASSWORD:-CHANGE_ME}"
      source: "rad_external"
    noaccess2:
      source: "ems_local"
      username: "${EMS_AUTH_NOACCESS_NOACCESS2_USERNAME:-example_noaccess_noaccess2}"
      password: "${EMS_AUTH_NOACCESS_NOACCESS2_PASSWORD:-CHANGE_ME}"
