version: 1

ems:
  # Two lab EMS servers are tested in turn; they never manage the same node, so
  # move the nodes to the selected server before running.
  # Selection order: EMS_TARGET environment variable > default_target.
  # A target's keys override the shared keys below.
  default_target: "redhat"
  verify_tls: false
  timeout: 60
  # Directory that holds the per-version OpenAPI YAML folders shipped with the
  # EMS firmware, for example "<openapi_root>/03.00.11 (AAVV.221)/NetAtlasEMS_OpenAPI_20260213.yaml".
  # These YAML files are not part of this repository, so the location is machine
  # specific. Use forward slashes; the YAML loader parses quoted values as Python
  # string literals and would reject "D:\FW\..." backslash escapes.
  # Override order: EMS_OPENAPI_YAML_FILE > EMS_OPENAPI_ROOT > this value.
  # Leave it out on machines without the firmware share; the OpenAPI YAML guard
  # then skips instead of failing.
  openapi_root: "D:/FW/NetAtlasEMS"
  targets:
    ubuntu:
      rest_api_url: "https://192.168.128.8:9116/netatlasemsapi"
      version: "03.00.11 (AAVV.221) b13"
      platform: "Ubuntu"
    # The RedHat build currently supports NeoX series devices only.
    redhat:
      rest_api_url: "https://192.168.128.100:9116/netatlasemsapi"
      version: "03.00.11 (AAVV.221) b12"
      platform: "RedHat 9 (HA)"
