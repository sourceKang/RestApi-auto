# NeoX new-feature test data index.
#
# Workflow for every new NeoX feature:
# 1. Use Swagger/OpenAPI to determine REST endpoint, JSON key names, and schema shape.
# 2. Use NeoX Series User's Guide to determine safe values, ranges, and CLI semantics.
# 3. Apply the REST request only to the approved NODE3 target data.
# 4. Verify the result with a read-only CLI show command on the device.
# 5. Store passing data and observed failing data under configs/neox_config/ for reuse.

source:
  swagger: "configs/neox_config/reference/neox_swagger_data.yaml"
  user_guide_reference: "configs/neox_config/reference/neox_ug_parameter_reference.yaml"
  user_guide_text: "reports/neox_ug_text.txt"

features:
  ge_config:
    endpoint: "/configNeoXSeries/interface/ge/{devicename}/{slotid}/{portid}"
    normal_data:
      - "configs/neox_config/ge/neox_ge_full_accepted_payload.json"
    abnormal_data:
      - "configs/neox_config/ge/neox_ge_full_accepted_payload.json#negative_cases"
    cli_reference:
      - "configs/neox_config/ge/neox_ge_full_accepted_payload.json#show_commands"
    status: "GE official success data, max variants, negative cases, and show-command references are consolidated in one GE payload config file."
  nni_config:
    endpoint: "/configNeoXSeries/interface/nni/{devicename}/{slotid}/{portid}"
    normal_data:
      - "configs/neox_config/nni/neox_nni_full_accepted_payload.json"
    abnormal_data: []
    cli_reference:
      - "show running-config interface nni {portid}"
    status: "NNI official min/max payloads are consolidated in one NNI payload config file and confirmed on NODE3 NNI slot 4 with CLI verification."

  vlan_config:
    endpoint: "/configNeoXSeries/vlan/{devicename}/{vid}"
    normal_data:
      - "configs/neox_config/vlan/neox_vlan_minmax_payloads.json"
    abnormal_data:
      - "configs/neox_config/vlan/neox_vlan_minmax_payloads.json#negative_cases"
    cli_reference:
      - "NeoX Series UG V1.02 Ed1, pages 546-547: show vlan {vid}"
    status: "EMS b10 VLAN path is synchronized with live Swagger. Create cases capture a read-only pre-REST CLI baseline and verify post-REST CLI ground truth."

  ont_config:
    endpoint: "/configNeoXSeries/interface/remote/{devicename}/{slotid}/{portid}/{ontid}"
    normal_data:
      - "configs/neox_config/ont/neox_ont_minmax_payloads.json"
    abnormal_data:
      - "configs/neox_config/ont/neox_ont_minmax_payloads.json#negative_cases"
    cli_reference:
      - "show running-config interface xpon {slotid}-{portid}"
    status: "ONT official min/max payloads, dynamic max variant, and negative cases are consolidated in one ONT payload config file."

  neox_profiles:
    endpoint: "/configNeoXSeries/profile/{devicename}/{profile_type}/{profilename}"
    normal_data:
      - "configs/neox_config/profiles/minmax/"
    abnormal_data:
      - "configs/neox_config/profiles/minmax/#negative_cases"
    cli_reference:
      - "configs/neox_config/profiles/minmax/#cli_verify"
    status: "Profile min/max payloads, CLI verification metadata, and active negative cases are consolidated into one JSON file per profile type."








