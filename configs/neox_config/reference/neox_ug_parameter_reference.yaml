ge_port:
  source_lines: "11086-11143"
  api_schema: "GePortInfo.Content"
  fields:
    portenable:
      manual_name: "Active"
      allowed: ["enable", "disable"]
    portname:
      manual_name: "Name"
      max_length: 31
    auto_nego:
      manual_name: "Auto-Nego"
      allowed: ["enable", "disable"]
    flow:
      manual_name: "Flow-Ctrl"
      allowed: ["enable", "disable"]
    portspeed:
      manual_name: "Speed"
      allowed: ["auto", "10g-full", "2.5g-full", "1g-full", "100-full", "100-half"]
    frametype:
      manual_name: "Frame-Type"
      allowed: ["all", "tag"]
    mtu:
      manual_name: "MTU"
      type: "integer"
  test_field_groups:
    smoke_safe:
      fields: ["portenable", "portname", "auto_nego", "flow", "portspeed", "frametype"]
      note: "Documented in UG and present in Swagger. Prefer conservative values that keep the port enabled and auto speed negotiation stable."
    needs_environment_data:
      fields: ["pvid", "vlan_list", "ratelimitname", "shapingname", "weightname", "profile_aclprofilename", "port_aclprofile_list", "egress_profile_list", "igmp_grouppriprofile_list", "acl_maclist", "acl_ouilist", "fdb_list"]
      note: "Requires existing VLAN/profile/MAC/IP data or a setup/cleanup flow before readwrite testing."
    schema_or_negative_only:
      fields: ["bias_alarm_high", "bias_alarm_low", "bias_warn_high", "bias_warn_low", "rxpower_alarm_high", "rxpower_alarm_low", "rxpower_warn_high", "rxpower_warn_low", "temperature_alarm_high", "temperature_alarm_low", "temperature_warn_high", "temperature_warn_low", "txpower_alarm_high", "txpower_alarm_low", "txpower_warn_high", "txpower_warn_low", "voltage_alarm_high", "voltage_alarm_low", "voltage_warn_high", "voltage_warn_low", "customtype", "tel"]
      note: "Swagger exposes placeholder strings; UG Port > GE does not provide enough confirmed API-safe values for smoke tests."
    advanced_risk:
      fields: ["dot1xcontrol", "dot1xreauthpeiod", "dotlxactive", "dotlxauthone", "dotlxcircuitinfo", "dotlxserverindex", "dscp", "lldp_admin", "lldp_management", "lldp_notification", "lldp_org_dot1", "lldp_org_dot3_link", "lldp_org_dot3_macphy", "lldp_org_dot3_maxframe", "lldp_portdesc", "lldp_systemcap", "lldp_systemdsc", "lldp_systemname", "loopguard", "loopguard_policy", "loopguard_recovertime", "macfilter", "macfiltermode", "ouifilter", "ouifiltermode", "outertpid", "packfiltertype", "pwsaving", "pwsaving_awake", "pwsaving_sleep", "snooping_dhcp", "snooping_dhcpv6", "snooping_ipmacbinding", "snooping_maxlease", "snooping_vlanlist", "spoofing_action", "staticipfilter_ipmacbinding", "staticipfilter_list", "vlantrans_list", "vlantls_list", "vlantrunk_ether_list", "vlantrunk_subnet_list", "vlantrunk_untag_list", "vlantrunk_vlan_list"]
      note: "Can affect authentication, VLAN behavior, DHCP, loop protection, power saving, filtering, or subscriber traffic. Keep behind explicit opt-in tests."

