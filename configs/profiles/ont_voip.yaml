# REST API profile test data.
profiles:
  ont_voip_dialplan_profile_data:
    profiletype: 'ONTVoipDialPlanProfile'
    profilename: '#RestApi_ontVoipDialPlan'
    post_profile_info: |
      {
        "ontvoipdialplanprofile_criticaltimeout": "8000",
        "ontvoipdialplanprofile_maxsize": "256",
        "ontvoipdialplanprofile_partialtimeout": "32000",
        "ontvoipdialplanprofile_identifier": "+88603(X.)",
        "ontvoipdialplanprofile_format": "h248"
      }
    patch_profile_info: |
      {
        "ontvoipdialplanprofile_criticaltimeout": "7999",
        "ontvoipdialplanprofile_maxsize": "255",
        "ontvoipdialplanprofile_partialtimeout": "31999",
        "ontvoipdialplanprofile_identifier": "+88603(Y.)",
        "ontvoipdialplanprofile_format": "NSC"
      }
    invalid_params_to_test: |
      [
        {
          "ontvoipdialplanprofile_criticaltimeout": "-100",
          "expected_error": "[Invalid parameter] Critical-Dial-Timeout: Range 0~8000"
        },
        {
          "ontvoipdialplanprofile_maxsize": "3000",
          "expected_error": "[Invalid parameter] Max Size: Range 1~256"
        },
        {
          "ontvoipdialplanprofile_partialtimeout": "100000",
          "expected_error": "[Invalid parameter] Partial-Dial-Timeout: Range 0~32000"
        },
        {
          "ontvoipdialplanprofile_identifier": "++88603(X.)!!!!!!!123414123abdfsdfhwer!!!!fgfsdg!!!!!!!!!!!!!!0123456789/*57893520",
          "expected_error": "[Invalid parameter]  Content-table token: Maximum length is 28"
        },
        {
          "ontvoipdialplanprofile_format": "sip",
          "expected_error": "The key ontvoipdialplanprofile_format value is invalid, please check it again."
        }
      ]
