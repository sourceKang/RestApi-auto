[pytest]
addopts = -vv
testpaths = tests
pythonpath = .
filterwarnings =
    ignore::urllib3.exceptions.InsecureRequestWarning
markers =
    session: user session API tests
    session_lifetime: long-running absolute session lifetime validation (about 10 minutes)
    alarm: active/history alarm API tests
    inventory: device, slot, port and ONT inventory API tests
    ont: ONT API tests
    provision: ONT/GE service provisioning API tests
    remoteconsole: remote console API tests
    neox_config: NeoX-specific configuration API tests enabled by --run-neox-config
    neox_profile: NeoX-specific profile API tests enabled by --run-neox-config
    neox_probe: exploratory NeoX probe tests outside the official 80-case plan
    neox_parallel_group(name): NeoX resource group used by --neox-parallel-mode and xdist loadgroup
    neox_parallel_scope(scope): NeoX scoped scheduling classification such as device or ems
    xdist_group(name): pytest-xdist loadgroup marker for grouped parallel scheduling
    profile: profile API tests converted from legacy REST API tests
    summary: synthetic summary cases for report/allure comparison
    readwrite: cases using a readwrite session
    readonly: cases using a readonly session
    noaccess: cases using a noaccess session
    authmatrix: optional RAD external summary checks enabled by --auth-matrix
    openapi: offline OpenAPI YAML contract checks
    live_swagger: read-only live Swagger /v3/api-docs checks enabled by --run-live-swagger-check
    mutating: cases that create, update, patch or delete EMS data
    destructive: cases that may affect DUT or EMS runtime state
    device_scoped: cases requiring node-local exclusive scheduling in parallel mode
    ems_scoped: cases requiring EMS-global exclusive scheduling in parallel mode
    alarm_delete: history alarm delete cases that require --run-alarm-delete
    smoke: fast confidence checks
    testlink_case(case_id, name): TestLink case registered at collection so a skipped or interrupted test still reports its case id
    testlink_runtime_case(case_id): TestLink case a service may add while the test runs, not registered at collection and not reported as id drift
    offline: unit tests that need no EMS, DUT or network and register no TestLink case; run in CI
