[pytest]
addopts = -vv
testpaths = tests
pythonpath = .
filterwarnings =
    ignore::urllib3.exceptions.InsecureRequestWarning
markers =
    session: user session API tests
    alarm: active/history alarm API tests
    inventory: device, slot, port and ONT inventory API tests
    ont: ONT API tests
    provision: ONT/GE service provisioning API tests
    remoteconsole: remote console API tests
    neox_config: NeoX-specific configuration API tests enabled by --run-neox-config
    neox_profile: NeoX-specific profile API tests enabled by --run-neox-config
    neox_probe: exploratory NeoX probe tests outside the official 80-case plan
    profile: profile API tests converted from legacy REST API tests
    summary: synthetic summary cases for report/allure comparison
    readwrite: cases using a readwrite session
    readonly: cases using a readonly session
    noaccess: cases using a noaccess session
    authmatrix: optional RAD external summary checks enabled by --auth-matrix
    mutating: cases that create, update, patch or delete EMS data
    destructive: cases that may affect DUT or EMS runtime state
    alarm_delete: history alarm delete cases that require --run-alarm-delete
    smoke: fast confidence checks
    regression: full regression checks
